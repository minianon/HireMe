version: "3.8"

# IMPORTANT: Replace placeholder values below with your actual credentials
# - Get Clerk keys from: https://dashboard.clerk.com/
# - Get Cloudinary keys from: https://console.cloudinary.com/
# - NEVER commit real credentials to Git!

services:
  mongodb:
    image: mongo:7.0
    container_name: hireme-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hireme-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireme-app
    restart: unless-stopped
    ports:
      - "3000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017
      - JWT_SECRET=default-jwt-secret-change-me
      - CLERK_WEBHOOK_SECRET=
      - CLOUDINARY_NAME=
      - CLOUDINARY_API_KEY=
      - CLOUDINARY_SECRET_KEY=
    depends_on:
      - mongodb
    networks:
      - hireme-network

networks:
  hireme-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
